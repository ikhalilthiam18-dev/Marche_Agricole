{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <h2 class="mb-4">✏️ Modifier le produit</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Nom du produit</label>
                {{ form.nom }}
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                {{ form.description }}
            </div>

            <div class="mb-3">
                <label class="form-label">Prix</label>
                {{ form.prix }}
            </div>

            <div class="mb-3">
                <label class="form-label">Quantité en stock</label>
                {{ form.quantite_stock }}
            </div>

            <div class="mb-3">
                <label class="form-label">Image</label>
                {{ form.image }}
                {% if produit.image %}
                    <div class="mt-2">
                        <img src="{{ produit.image.url }}" width="120" class="rounded shadow-sm">
                    </div>
                {% endif %}
            </div>

            <div class="form-check mb-4">
                {{ form.disponible }}
                <label class="form-check-label ms-2">Produit disponible</label>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-warning text-white">
                    <i class="bi bi-save"></i> Mettre à jour
                </button>
                <a href="{% url 'tableau_bord' %}" class="btn btn-outline-secondary">
                    Annuler
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
