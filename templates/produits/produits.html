
{% extends 'base.html' %}
{% block content %}

<h2>Produits</h2>

<a href="/produits/ajouter/" class="btn">Ajouter produit</a>

<div class="grid">

{% for p in produits %}

<div class="card">

{% if p.image %}
<img src="{{ p.image.url }}">
{% endif %}

<h3>{{p.nom}}</h3>

<p>{{p.prix}} FCFA</p>

<a href="/commande/ajouter/{{p.id}}/">Ajouter panier</a>

<a href="/produits/supprimer/{{p.id}}/">Supprimer</a>

</div>

{% endfor %}

</div>

{% endblock %}
